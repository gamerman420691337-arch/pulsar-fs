[package]
name = "pulsar-engine"
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
pulsar-core = { path = "../pulsar-core" }
pulsar-protocol = { path = "../pulsar-protocol" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ring = "=0.17.14"
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2"
interprocess = "2.4.4"
ndarray = "0.17"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }

tough = { version = "=0.24.0", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
jiff = "0.2"
base64 = "0.22"
wasmtime = { version = "=49.0.2", optional = true, default-features = false, features = ["std", "runtime", "cranelift"] }
arc-swap = "=1.9.3"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "=1.4.8"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
wat = "=1.249.0"

[features]
default = []
wasm = ["dep:wasmtime"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt", "cuda"]
