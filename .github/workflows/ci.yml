name: Native deadline write probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise Pulsar closed-peer write
        run: cargo test -p pulsar-protocol --lib deadline_stream_closed_peer_write_reports_broken_pipe --locked
