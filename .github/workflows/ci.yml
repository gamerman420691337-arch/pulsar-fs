name: Native timing fixture diagnostic
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS dependencies
        run: brew install ffmpeg
      - name: Exercise timing fixture tests
        run: cargo test -p pulsar-clients --lib browser_player_control::timing::tests --locked -- --test-threads=1
