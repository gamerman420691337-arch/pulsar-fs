name: Native package import diagnostic
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS dependencies
        run: brew install ffmpeg
      - name: Exercise package import socket tests
        run: cargo test -p pulsar-clients --lib project_package_import::socket_tests --locked -- --test-threads=1
