name: Native socket close probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run isolated socket experiment
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 scripts/macos_socket_probe.rs -o "$RUNNER_TEMP/pulsar-socket-probe"
          "$RUNNER_TEMP/pulsar-socket-probe"
      - name: Exercise Pulsar deadline stream
        run: cargo test -p pulsar-protocol --lib deadline_stream_ --locked
