name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run full portable and Linux Engine suites
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-v2

      # Compilation needs native headers on Linux, not an installed media stack.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Check workspace compilation
        run: cargo check --workspace --all-targets --locked

      - name: Check project and architecture
        if: runner.os == 'Linux'
        run: |
          python3 -B scripts/execution_dashboard.py --check
          python3 -B scripts/test_execution_dashboard.py
          python3 -B -m unittest discover -s scripts -p test_score_sterile_browser_recording.py
          node scripts/check-architecture.mjs
          node --test scripts/architecture-source-guards.test.mjs scripts/browser-live-player.test.mjs scripts/sterile-reference.test.mjs

      # These exercise deterministic code and wire contracts without building the
      # large Engine or GUI test executables. Full runtime suites run below.
      - name: Test fast contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p pulsar-core --lib --locked
          cargo test -p pulsar-protocol --lib project_package::tests --locked | tee "$RUNNER_TEMP/protocol-results.txt"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/protocol-results.txt"

  full:
    name: Full (${{ matrix.os }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-v2
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev libudev-dev pkg-config bubblewrap
      - name: Install Windows media tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Test portable contracts and clients
        run: cargo test -p pulsar-core -p pulsar-protocol -p pulsar-clients --locked
      - name: Test Linux Engine and media contracts
        if: runner.os == 'Linux'
        run: |
          timeout 15s sudo loginctl enable-linger "$(id -un)"
          timeout 15s sudo systemctl start "user@$(id -u).service"
          PULSAR_ENGINE_TEST_RUNTIME_SECONDS=1200 scripts/test-engine-delegated.sh -- --test-threads=1
